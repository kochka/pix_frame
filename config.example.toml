# pix-frame device configuration.
#
# Copy this file to `config.toml` (ignored by git, it holds your Wi-Fi
# password), edit it, then write it to the frame with `mise run flash-config`.
# Every section except [display] is optional: screens that need a missing
# section are simply never shown. Keys left out of [display] and [clock]
# keep their default.

[display]
# Show an information screen (clock, weather...) after this many animations.
# 0 disables information screens.
info_every = 5
# An animation loops until at least this many seconds have been scheduled,
# so short loops repeat and long ones play once in full. Default 3.
min_play_seconds = 3
# Unit of every temperature shown: "C" (default) or "F".
temperature_unit = "C"

[clock]
# Optional colors of the clock digits, "#RRGGBB". Defaults: pink hours above
# cyan minutes.
hour_color = "#FF2882"
minute_color = "#00D2FF"

[wifi]
ssid = "MyNetwork"
password = "secret"

[location]
# Enables the outdoor weather screen (Open-Meteo, needs [wifi]) and gives the
# exact local time zone offset for the clock.
latitude = 48.8566
longitude = 2.3522
# IANA time zone name.
timezone = "Europe/Paris"

[light]
# Ambient light calibration. The firmware logs the sensor voltage every
# 10 seconds ("light: ... mV"): read it with the frame assembled in its place.
# At or below dark_mv the matrix runs at min_brightness, at or above
# bright_mv at max_brightness, linearly in between. Without this sectic'son the
# brightness stays fixed.
dark_mv = 400
bright_mv = 2800
# 0..=255. Keep max_brightness modest: 256 WS2815 at full white draw far more
# than a small supply can deliver.
min_brightness = 40
max_brightness = 100
