[package]
name = "pix-frame-firmware"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
critical-section = "1.2.0"
defmt = "1.0.1"
esp-bootloader-esp-idf = { version = "0.6.0", features = ["defmt", "esp32c6"] }
esp-hal = { version = "~1.2.0", features = ["defmt", "esp32c6", "unstable"] }
esp-hal-smartled = "0.18.0"
esp-storage = { version = "0.10.0", features = ["esp32c6"] }
esp-println = { version = "0.17.0", default-features = false, features = ["critical-section", "defmt-espflash", "esp32c6", "uart"] }
pxa-core = { path = "../crates/pxa-core" }
smart-leds = "0.4.0"
