[package]
name = "pix-frame-firmware"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
critical-section = "1.2.0"
defmt = "1.0.1"
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-net = { version = "0.9.1", features = ["defmt", "dhcpv4", "dns", "medium-ethernet", "proto-ipv4", "udp"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
embedded-storage = "0.3.1"
esp-alloc = { version = "0.11.0", features = ["esp32c6"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["defmt", "esp32c6"] }
esp-hal = { version = "~1.2.0", features = ["defmt", "esp32c6", "unstable"] }
esp-nvs = { version = "0.5.0", features = ["defmt"] }
esp-radio = { version = "1.0.0-beta.1", features = ["defmt", "esp-alloc", "esp32c6", "unstable", "wifi"] }
esp-rtos = { version = "0.4.0", features = ["defmt", "embassy", "esp-alloc", "esp-radio", "esp32c6"] }
heapless = "0.9.3"
esp-storage = { version = "0.10.0", features = ["embedded-storage", "esp32c6"] }
esp-println = { version = "0.17.0", default-features = false, features = ["auto", "critical-section", "defmt-espflash", "esp32c6"] }
pxa-core = { path = "../crates/pxa-core" }
smart-leds = "0.4.0"
static_cell = "2.1.1"
